// ============================================================
// android/app/build.gradle
// Módulo Android de "eltonel_full"
// CORRECCIÓN CRÍTICA: namespace/applicationId = com.eltonel.app
// (debe coincidir con el paquete real de MainActivity.kt)
// compileSdk 35 · minSdk 21
// ============================================================

plugins {
    id "com.android.application"                 // Plugin que empaqueta el APK
    id "kotlin-android"                          // Soporte para código Kotlin
    id "dev.flutter.flutter-gradle-plugin"       // Puente entre Flutter (Dart) y Gradle
}

// --- Lectura de local.properties (SDK de Flutter y versiones) ---
def localProperties = new Properties()           // Objeto para leer pares clave=valor
def localPropertiesFile = rootProject.file('local.properties')  // Archivo generado por Flutter
if (localPropertiesFile.exists()) {              // Solo si existe (en CI puede no existir)
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)             // Carga flutter.sdk, versionCode, etc.
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')   // Ruta del SDK de Flutter
if (flutterRoot == null) {
    flutterRoot = ''                             // Vacío: el plugin de Flutter lo resuelve
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')  // Código de versión
if (flutterVersionCode == null) {
    flutterVersionCode = '1'                     // Valor por defecto
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')  // Nombre de versión
if (flutterVersionName == null) {
    flutterVersionName = '1.0'                   // Valor por defecto
}

android {
    namespace "com.eltonel.app"                  // ✅ CORREGIDO: coincide con package de MainActivity.kt
    compileSdkVersion 35                         // Requerido por flutter_plugin_android_lifecycle
    ndkVersion flutter.ndkVersion                // NDK que define Flutter (evita conflictos)

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8  // Sintaxis Java compatible JDK 8
        targetCompatibility JavaVersion.VERSION_1_8  // Bytecode para JDK 8
    }

    kotlinOptions {
        jvmTarget = '1.8'                        // Kotlin hacia el mismo target Java 8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'   // Incluye el código Kotlin (com/eltonel/app)
    }

    defaultConfig {
        applicationId "com.eltonel.app"          // ✅ CORREGIDO: identidad real de la app
        minSdkVersion 21                         // Android 5.0+
        targetSdkVersion 35                      // Coincide con compileSdk
        versionCode flutterVersionCode.toInteger()  // Número interno (viene de pubspec)
        versionName flutterVersionName           // Versión visible (ej. "1.0.0")
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug   // Firma debug para pruebas
        }
    }
}

flutter {
    source '../..'                               // Código Dart del proyecto
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"  // Stdlib Kotlin
}