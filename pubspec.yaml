name: eltonel_full
description: Sistema de Gestión Interna Desayunos El Tonel
version: 2.0.0+1

environment:
  sdk: ">=2.19.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  provider: ^6.0.5
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/courier_new.ttf
  fonts:
    - family: CourierNew
      fonts:
        - asset: assets/fonts/courier_new.ttf
