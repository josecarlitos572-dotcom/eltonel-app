name: eltonel_app
description: Aplicación de gestión para Desayunos El Tonel.
publish_to: 'none'
version: 1.0.0+16

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.6
  
  # Base de datos y utilidades
  sqflite: ^2.3.0
  path: ^1.8.3
  crypto: ^3.0.3
  intl: ^0.18.1
  
  # Estado y navegación
  provider: ^6.1.1
  url_launcher: ^6.2.4
  
  # Dependencias del proyecto
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  share_plus: ^10.0.0
  mobile_scanner: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1  # REM: Para generar íconos automáticamente

flutter:
  uses-material-design: true
  
  # REM: Assets para el ícono de la app
  assets:
    - assets/

# REM: Configuración de flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21