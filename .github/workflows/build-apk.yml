# ============================================================
# build-apk.yml — Workflow de GitHub Actions para El Tonel
# Genera íconos, elimina recursos duplicados y compila el APK
# ============================================================

name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK de Producción
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      # 2. Configurar Java
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Configurar Flutter
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # 4. Limpiar caché
      - name: Limpiar proyecto
        run: flutter clean

      # 5. Instalar dependencias (incluye flutter_launcher_icons)
      - name: Instalar Dependencias
        run: flutter pub get

      # 6. Generar íconos automáticamente
      - name: Generar Íconos de App
        run: dart run flutter_launcher_icons

      # 7. Eliminar archivo de colores duplicado generado por el plugin
      - name: Eliminar Recursos Duplicados
        run: rm -f android/app/src/main/res/values/ic_launcher_colors.xml

      # 8. Compilar APK
      - name: Compilar APK de Producción
        run: flutter build apk --release

      # 9. Subir APK
      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: eltonel-app-release
          path: build/app/outputs/flutter-apk/app-release.apk